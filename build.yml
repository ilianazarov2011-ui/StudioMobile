name: build
on: [push, workflow_dispatch]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" \
                         "ndk;24.0.8215888" "cmake;3.22.1"

      - run: sudo apt-get update && sudo apt-get install -y python3 zstd

      - run: |
          tools/fetch_upstream.sh
          python3 tools/prepare_assets.py \
            upstream-winlator/app/app/src/main/assets app/app/src/main/assets

      - run: cd app && ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with: { name: apk, path: '**/*.apk' }
