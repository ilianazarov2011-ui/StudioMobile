# Pipeline: clona narezy/StudioMobile e compila o APK (arm64-v8a)
# Requisitos do projeto: JDK 17, Android SDK 35, NDK r24 (24.0.8215888),
# CMake 3.22.1, Python 3 e zstd.
#
# O log do Gradle/CMake tem dezenas de milhares de warnings e estoura o limite
# de 4 MB do GitLab (o erro real some). Por isso o build escreve num arquivo
# (build.log), mostra só o trecho do erro no job e guarda o log completo (build.log.gz) como artifact.

stages:
  - build

variables:
  STUDIO_REPO: "https://github.com/narezy/StudioMobile.git"
  STUDIO_BRANCH: "main"
  ANDROID_HOME: "$CI_PROJECT_DIR/android-sdk"
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/android-sdk"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
  CMDLINE_TOOLS_ZIP: "commandlinetools-linux-11076708_latest.zip"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"

default:
  image: eclipse-temurin:17-jdk-jammy
  cache:
    key: studiomobile-android
    paths:
      - android-sdk/
      - .gradle-home/caches/
      - .gradle-home/wrapper/

.setup: &setup
  - apt-get update -qq
  - apt-get install -y -qq --no-install-recommends git curl unzip python3 zstd ca-certificates make
  # Android command-line tools (só baixa se não estiver no cache)
  - |
    if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
      mkdir -p "$ANDROID_HOME/cmdline-tools"
      curl -fsSL -o /tmp/cmdtools.zip "https://dl.google.com/android/repository/$CMDLINE_TOOLS_ZIP"
      unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
      mv /tmp/cmdtools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
    fi
  - export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
  - yes | sdkmanager --licenses > /dev/null || true
  - sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;24.0.8215888" "cmake;3.22.1" > /dev/null

.prepare_source: &prepare_source
  # 1) clona o repositório do StudioMobile
  - rm -rf StudioMobile
  - git clone --depth 1 --branch "$STUDIO_BRANCH" "$STUDIO_REPO" StudioMobile
  - cd StudioMobile
  # 1.1) correções no código do StudioMobile (idempotentes; ignoram o que o upstream já corrigiu):
  #   - NPE no StudioOverlay (updateChips antes de btMouse existir)
  #   - BufferOverflowException ao receber a URL de login (pacote do WinHandler tem só 256 bytes)
  #   - NPE no ContainerManager.loadContainers (pasta de container sem config derrubava o app em toda abertura)
  #   - proteção em segundo plano ligada por padrão (Android matava o Wine ao ir ao navegador autorizar o login)
  #   - SIGSEGV em Drawable.copyArea (memória do GPUImage liberada enquanto outro Drawable ainda escrevia nela)
  - |
    python3 - <<'PY'
    import re

    def patch(path, pairs):
        # tudo ou nada: só aplica se TODOS os trechos esperados existirem (idempotente)
        s = open(path).read()
        if not all(old in s for old, _ in pairs):
            print("  skipped (already fixed or upstream changed):", path)
            return
        for old, new in pairs:
            s = s.replace(old, new, 1)
        open(path, "w").write(s)
        print("  patched:", path)

    J = "app/app/src/main/java/"

    # 1) NPE: updateChips() chamado antes de btMouse existir
    patch(J + "cat/narezany/studio/session/StudioOverlay.java", [
        (r'''            mouseButtons[i] = chip;
            }
            updateChips();
    ''', r'''            mouseButtons[i] = chip;
            }
    '''),
        (r'''        makeDraggable(dock, new View[]{btMenu, btKeyboard, btMouse});
    ''', r'''        makeDraggable(dock, new View[]{btMenu, btKeyboard, btMouse});
            updateChips();
    '''),
    ])

    # 2) BufferOverflowException: URL de login (roblox-studio-auth) maior que o pacote de 256 bytes do WinHandler
    patch(J + "com/winlator/XServerDisplayActivity.java", [
        (r'''        if (url != null && studioExePath != null && container != null) {
                winHandler.exec(WineUtils.unixToDOSPath(studioExePath, container), "\""+url+"\"");
            }
        }
    ''', r'''        if (url != null && studioExePath != null && container != null) execStudioUrl(url);
        }

        /**
         * WinHandler packets are fixed at 256 bytes, but roblox-studio-auth URLs are much longer
         * (BufferOverflowException). Long URLs go through a small .bat inside the container instead.
         */
        private void execStudioUrl(String url) {
            String exe = WineUtils.unixToDOSPath(studioExePath, container);
            String params = "\""+url+"\"";
            if (9 + exe.getBytes().length + params.getBytes().length <= 240) {
                winHandler.exec(exe, params);
                return;
            }
            File dir = new File(container.getRootDir(), ".wine/drive_c/windows/temp");
            dir.mkdirs();
            File bat = new File(dir, "studio_auth.bat");
            String script = "@echo off\r\n\""+exe+"\" \""+url.replace("%", "%%")+"\"\r\n";
            if (FileUtils.writeString(bat, script)) {
                winHandler.exec("cmd.exe", "/c C:\\windows\\temp\\studio_auth.bat");
            }
        }
    '''),
    ])

    patch(J + "com/winlator/winhandler/WinHandler.java", [
        (r'''        addAction(() -> {
                sendData.rewind();
                sendData.put(RequestCodes.EXEC);
                byte[] filenameBytes = filename.getBytes();
                sendData.putInt(filenameBytes.length);
                sendData.put(filenameBytes);
                if (parameters != null) {
                    byte[] parametersBytes = parameters.getBytes();
                    sendData.putInt(parametersBytes.length);
                    sendData.put(parametersBytes);
                }
                else sendData.putInt(0);
                sendPacket(CLIENT_PORT);
            });
    ''', r'''        addAction(() -> {
                try {
                    sendData.rewind();
                    sendData.put(RequestCodes.EXEC);
                    byte[] filenameBytes = filename.getBytes();
                    sendData.putInt(filenameBytes.length);
                    sendData.put(filenameBytes);
                    if (parameters != null) {
                        byte[] parametersBytes = parameters.getBytes();
                        sendData.putInt(parametersBytes.length);
                        sendData.put(parametersBytes);
                    }
                    else sendData.putInt(0);
                    sendPacket(CLIENT_PORT);
                }
                catch (java.nio.BufferOverflowException e) {
                    android.util.Log.e("WinHandler", "exec: command too long for the 256-byte packet, ignored");
                    sendData.clear();
                }
            });
    '''),
    ])

    # 3) Release crash: ContainerManager.loadContainers() quebrava (NPE) com pasta de container sem config
    #    (criação interrompida ou ainda em andamento) -> o app crashava em TODA abertura.

    patch(J + "com/winlator/container/ContainerManager.java", [
        (r'''    private void loadContainers() {
            containers.clear();
            maxContainerId = 0;

            try {
                File[] files = homeDir.listFiles();
                if (files != null) {
                    for (File file : files) {
                        if (file.isDirectory()) {
                            if (file.getName().startsWith(RootFS.USER+"-")) {
                                Container container = new Container(Integer.parseInt(file.getName().replace(RootFS.USER+"-", "")));
                                container.setRootDir(new File(homeDir, RootFS.USER+"-"+container.id));
                                JSONObject data = new JSONObject(FileUtils.readString(container.getConfigFile()));
                                container.loadData(data);
                                containers.add(container);
                                maxContainerId = Math.max(maxContainerId, container.id);
                            }
                        }
                    }
                }
            }
            catch (JSONException e) {}
        }

    ''', r'''    private void loadContainers() {
            containers.clear();
            maxContainerId = 0;

            File[] files = homeDir.listFiles();
            if (files == null) return;

            for (File file : files) {
                if (!file.isDirectory() || !file.getName().startsWith(RootFS.USER+"-")) continue;
                try {
                    int id = Integer.parseInt(file.getName().replace(RootFS.USER+"-", ""));
                    // Count the id even if the container is broken, so a new one never reuses this folder.
                    maxContainerId = Math.max(maxContainerId, id);

                    Container container = new Container(id);
                    container.setRootDir(new File(homeDir, RootFS.USER+"-"+container.id));
                    byte[] config = FileUtils.read(container.getConfigFile());
                    // No config: creation was interrupted or is still running in another thread. Skip it.
                    if (config == null || config.length == 0) continue;

                    container.loadData(new JSONObject(new String(config, java.nio.charset.StandardCharsets.UTF_8)));
                    containers.add(container);
                }
                catch (JSONException | NumberFormatException e) {}
            }
        }

    '''),
    ])

    # 4) Debug: "crasha" ao ir ao navegador autorizar a conta. Sem foreground service o Android mata o
    #    processo do Wine em segundo plano (sem exceção Java). Proteção em segundo plano passa a vir LIGADA.
    patch(J + "com/winlator/services/ForegroundService.java", [
        (r'''prefs.getBoolean("enable_background_protection", false)''', r'''prefs.getBoolean("enable_background_protection", true)'''),
    ])
    patch(J + "com/winlator/SettingsFragment.java", [
        (r'''cbEnableBackgroundProtection.setChecked(preferences.getBoolean("enable_background_protection", false));''',
         r'''cbEnableBackgroundProtection.setChecked(preferences.getBoolean("enable_background_protection", true));'''),
    ])

    # 5) Crash nativo (SIGSEGV em Drawable.copyArea via MIT-SHM PutImage, ao voltar do navegador):
    #    a memória mapeada de um GPUImage era liberada enquanto outro Drawable (janela redirecionada
    #    compartilha a textura) ainda apontava para ela -> memcpy em memória liberada.
    patch(J + "com/winlator/renderer/GPUImage.java", [
        (r'''import androidx.annotation.Keep;
    ''', r'''import android.os.Handler;
    import android.os.Looper;

    import androidx.annotation.Keep;
    '''),
        (r'''import java.nio.ByteBuffer;
    ''', r'''import java.lang.ref.WeakReference;
    import java.nio.ByteBuffer;
    import java.nio.ByteOrder;
    import java.util.ArrayList;
    '''),
        (r'''    private int nativeHandle;
    ''', r'''    private int nativeHandle;
        private final ArrayList<WeakReference<Drawable>> users = new ArrayList<>();
    '''),
        (r'''    @Override
        public void destroy() {
            destroyImageKHR(imageKHRPtr);
            destroyHardwareBuffer(hardwareBufferPtr, locked);
            virtualData = null;
            imageKHRPtr = 0;
            hardwareBufferPtr = 0;
            super.destroy();
        }
    ''', r'''    /** Registers a drawable whose CPU data aliases this image's mapped memory (see destroy()). */
        public void addUser(Drawable drawable) {
            synchronized (users) {
                for (WeakReference<Drawable> ref : users) if (ref.get() == drawable) return;
                users.add(new WeakReference<>(drawable));
            }
        }

        @Override
        public void destroy() {
            final ByteBuffer mapped = virtualData;
            final long hardwareBuffer = hardwareBufferPtr;
            final boolean wasLocked = locked;

            // Other drawables (redirected windows share this image) may still write into the mapped
            // memory. Detach them first, otherwise the X server thread memcpy()s into freed memory.
            synchronized (users) {
                for (WeakReference<Drawable> ref : users) {
                    Drawable user = ref.get();
                    if (user == null || mapped == null || user.getData() != mapped) continue;

                    Texture current = user.getTexture();
                    if (current == this) user.setData(null);
                    else if (current instanceof GPUImage) user.setData(((GPUImage)current).getVirtualData());
                    else user.setData(ByteBuffer.allocateDirect(user.width * user.height * 4).order(ByteOrder.LITTLE_ENDIAN));
                }
                users.clear();
            }

            destroyImageKHR(imageKHRPtr);
            virtualData = null;
            imageKHRPtr = 0;
            hardwareBufferPtr = 0;

            // Free the CPU mapping a little later, so a native copy already in flight can finish.
            new Handler(Looper.getMainLooper()).postDelayed(() -> destroyHardwareBuffer(hardwareBuffer, wasLocked), 2000);
            super.destroy();
        }
    '''),
    ])

    patch(J + "com/winlator/xserver/Drawable.java", [
        (r'''    public void setTexture(Texture texture) {
            if (texture instanceof GPUImage) data = ((GPUImage)texture).getVirtualData();
            this.texture = texture;
        }
    ''', r'''    public void setTexture(Texture texture) {
            if (texture instanceof GPUImage) {
                data = ((GPUImage)texture).getVirtualData();
                ((GPUImage)texture).addUser(this);
            }
            this.texture = texture;
        }
    '''),
    ])
    PY
  # 2) clona o Winlator (upstream) + submódulo app
  - sh tools/fetch_upstream.sh
  # 3) prepara os assets (reescreve o caminho do rootfs para o pacote cat.narezany.studio)
  - python3 tools/prepare_assets.py upstream-winlator/app/app/src/main/assets app/app/src/main/assets
  - echo "sdk.dir=$ANDROID_HOME" > app/local.properties

# Roda o gradle sem inundar o log do job. Uso: GRADLE_TASK=:app:assembleDebug
.run_gradle: &run_gradle
  - cd "$CI_PROJECT_DIR/StudioMobile/app"
  - chmod +x gradlew
  - |
    rc=0
    ./gradlew "$GRADLE_TASK" --console=plain --stacktrace > "$CI_PROJECT_DIR/build.log" 2>&1 || rc=$?
    echo "gradle exit code: $rc"
    if [ "$rc" -ne 0 ]; then
      echo "================ ERRO NO BUILD ================"
      grep -n -B2 -A25 -E "What went wrong|FAILURE: Build failed|Execution failed for task" "$CI_PROJECT_DIR/build.log" | head -150 || true
      echo "================ ÚLTIMAS 60 LINHAS ================"
      tail -n 60 "$CI_PROJECT_DIR/build.log"
      exit "$rc"
    fi
    tail -n 5 "$CI_PROJECT_DIR/build.log"

# Confere o APK (zip válido + assinatura) e envia para o Package Registry do projeto.
# Link direto do .apk (sem zip): Deploy > Package registry > studiomobile.
# Uso: APK_LABEL=debug|release
.publish_apk: &publish_apk
  - |
    cd "$CI_PROJECT_DIR/out"
    APK="$(ls -1 *.apk | head -n 1)"
    [ -n "$APK" ] || { echo "ERRO: nenhum APK gerado"; exit 1; }
    mv "$APK" "StudioMobile-$APK_LABEL.apk"
    APK="StudioMobile-$APK_LABEL.apk"
    ls -l "$APK"
    sha256sum "$APK"
    unzip -tq "$APK" > /dev/null && echo "APK: estrutura zip OK"
    "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | head -n 3 || echo "AVISO: apksigner não validou a assinatura"
    curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
      --upload-file "$APK" \
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/studiomobile/$CI_COMMIT_SHORT_SHA/$APK" \
      && echo "Enviado ao Package Registry: studiomobile/$CI_COMMIT_SHORT_SHA/$APK" \
      || echo "AVISO: upload ao Package Registry falhou (o APK continua nos artifacts)"

build_debug:
  stage: build
  variables:
    GRADLE_TASK: ":app:assembleDebug"
    APK_LABEL: "debug"
  before_script:
    - *setup
  script:
    - *prepare_source
    - *run_gradle
    - mkdir -p "$CI_PROJECT_DIR/out"
    - cp "$CI_PROJECT_DIR"/StudioMobile/app/app/build/outputs/apk/debug/*.apk "$CI_PROJECT_DIR/out/"
    - *publish_apk
  after_script:
    - gzip -9 -f "$CI_PROJECT_DIR/build.log" || true
  artifacts:
    name: "studiomobile-debug-$CI_COMMIT_SHORT_SHA"
    when: always
    paths:
      - out/*.apk
      - build.log.gz
    expire_in: 14 days
  timeout: 2h

# Release assinado (manual).
# Opcional: em Settings > CI/CD > Variables (tipo "Variable", desmarque "Protect variable"
# se rodar fora de branch protegida):
#   KEYSTORE_B64 (keystore em base64), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Se KEYSTORE_B64 não existir, o job gera uma keystore temporária (APK instala normalmente,
# mas a assinatura muda a cada build e não atualiza por cima de outra assinatura).
build_release:
  stage: build
  when: manual
  variables:
    GRADLE_TASK: ":app:assembleRelease"
    APK_LABEL: "release"
  before_script:
    - *setup
  script:
    - *prepare_source
    - |
      SIGN_DIR="$CI_PROJECT_DIR/StudioMobile/signing"
      mkdir -p "$SIGN_DIR"
      KS_PASS="${KEYSTORE_PASSWORD:-android}"
      KS_ALIAS="${KEY_ALIAS:-studio}"
      KEY_PASS="${KEY_PASSWORD:-$KS_PASS}"
      if [ -n "$KEYSTORE_B64" ]; then
        echo "$KEYSTORE_B64" | base64 -d > "$SIGN_DIR/release.jks" || { echo "ERRO: KEYSTORE_B64 não é base64 válido"; exit 1; }
        if ! keytool -list -keystore "$SIGN_DIR/release.jks" -storepass "$KS_PASS" -alias "$KS_ALIAS" > /dev/null 2>&1; then
          echo "ERRO: keystore inválida, ou KEYSTORE_PASSWORD / KEY_ALIAS incorretos."
          exit 1
        fi
        echo "Usando keystore das variáveis do GitLab."
      else
        echo "AVISO: KEYSTORE_B64 não definido, gerando keystore temporária."
        KS_PASS="android"; KS_ALIAS="studio"; KEY_PASS="android"
        keytool -genkeypair -keystore "$SIGN_DIR/release.jks" -storepass "$KS_PASS" -keypass "$KEY_PASS" \
          -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=StudioMobile, O=CI, C=BR" > /dev/null
      fi
      {
        echo "storeFile=$SIGN_DIR/release.jks"
        echo "storePassword=$KS_PASS"
        echo "keyAlias=$KS_ALIAS"
        echo "keyPassword=$KEY_PASS"
      } > "$SIGN_DIR/keystore.properties"
    - *run_gradle
    - mkdir -p "$CI_PROJECT_DIR/out"
    - cp "$CI_PROJECT_DIR"/StudioMobile/app/app/build/outputs/apk/release/*.apk "$CI_PROJECT_DIR/out/"
    - *publish_apk
  after_script:
    - gzip -9 -f "$CI_PROJECT_DIR/build.log" || true
  artifacts:
    name: "studiomobile-release-$CI_COMMIT_SHORT_SHA"
    when: always
    paths:
      - out/*.apk
      - build.log.gz
    expire_in: 30 days
  timeout: 2h
